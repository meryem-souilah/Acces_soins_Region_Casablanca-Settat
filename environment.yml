# Environnement conda du projet — recommandé (surtout sous Windows) :
# conda-forge fournit GDAL/PROJ déjà compilés, sans conflit de versions.
#   conda env create -f environment.yml
#   conda activate geodata-sante
name: geodata-sante
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal            # ogr2ogr, gdalinfo (phases 1 à 3)
  - geopandas>=0.14
  - rasterio
  - shapely>=2
  - pyproj
  - osmnx>=1.9
  - matplotlib
  - pdfplumber
  - requests
  - psycopg2        # connexion PostGIS (intersession 3)
  - sqlalchemy
  - geoalchemy2
  - scikit-learn    # Geo-AI (intersession 4)
  - jupyterlab
